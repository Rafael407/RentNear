plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// API keys live in local.properties (git-ignored), never in source.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def prop = { String k -> (localProps.getProperty(k) ?: '').replace('"', '') }

android {
    namespace 'com.rentnear.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rentnear.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.9"

        buildConfigField "String", "GEOAPIFY_KEY", "\"${prop('GEOAPIFY_KEY')}\""
        buildConfigField "String", "CLOUDINARY_CLOUD", "\"${prop('CLOUDINARY_CLOUD')}\""
        buildConfigField "String", "CLOUDINARY_PRESET", "\"${prop('CLOUDINARY_PRESET')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // MVVM
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    // Navigation (bottom nav)
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Firebase (Spark plan: Auth + Firestore only)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'

    // Google sign-in
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Images
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // UI
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Map: MapLibre Native + OpenFreeMap tiles (free, no key)
    implementation 'org.maplibre.gl:android-sdk:11.5.2'

    // Nearby search: geohash helpers for Firestore range queries
    implementation 'com.firebase:geofire-android-common:3.2.0'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Due-time reminders (local notifications)
    implementation 'androidx.work:work-runtime:2.9.1'

    // Room: saved copy of the last nearby search (step 8)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Camera: QR scanning (ML Kit) and condition photos (CameraX); QR generation (ZXing)
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // CameraX's Java API returns ListenableFuture
    implementation 'com.google.guava:guava:31.1-android'

    // Geoapify (address search, walking directions) and Cloudinary uploads
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
